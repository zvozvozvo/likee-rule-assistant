<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Likee Rule Assistant</title><style>body{margin:0;font-family:Arial;background:#0f172a;color:#fff}header{padding:16px;background:#111827;position:sticky;top:0}input{width:100%;padding:12px;border-radius:10px;border:0;background:#1f2937;color:#fff}.f{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{padding:8px 12px;border:0;border-radius:999px;background:#334155;color:#fff}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px}.c{background:#1f2937;padding:14px;border-radius:12px;border-left:5px solid #64748b}.Reject{border-color:#ef4444}.Conceal{border-color:#f59e0b}.Ignore{border-color:#64748b}.TagA{border-color:#3b82f6}.tag{display:inline-block;background:#111827;padding:3px 8px;border-radius:999px;font-size:12px}</style></head><body><header><h2>Likee Rule Assistant</h2><input id=q placeholder='нож, вейп, roblox...'><div class=f><button onclick="F('all')">Все</button><button onclick="F('Reject')">Reject</button><button onclick="F('Conceal')">Conceal</button><button onclick="F('Ignore')">Ignore</button><button onclick="F('Tag A')">Tag A</button></div></header><div id=g class=g></div><script>const d=[["Оружие","Reject","Ствол на человека или стрельба.","Военные без стрельбы.",["оружие","пистолет"]],["Нож","Reject","Ножевое нападение.","Нож лежит.",["нож"]],["Кровь","Reject","Органы и открытые раны.","Медицина.",["кровь","раны"]],["Животные","Reject","Избиение и расчленение.","Без крови.",["животное"]],["Суицид","Reject","Петля, порезы.","Нет.",["суицид"]],["Терроризм","Reject","Пропаганда.","История.",["свастика"]],["Курение","Conceal","Взрослый курит.","Только дым.",["вейп","курит"]],["Продажа никотина","Reject","QR, цена.","Нет.",["qr"]],["Личные данные","Reject","Паспорт, телефон.","Замазано.",["паспорт","телефон"]],["Мокрая женщина","Tag A","Эротический контекст.","Без эротики.",["ванна"]],["Военный стреляет в воздух","Ignore","Не банить.","Не по людям.",["военный"]],["Roblox/Gacha","Reject","Детский хоррор.","Обычный мультик.",["roblox"]]];let f='all';const g=document.getElementById('g'),q=document.getElementById('q');q.oninput=R;function F(x){f=x;R()}function R(){const s=q.value.toLowerCase();g.innerHTML='';d.filter(r=>(f==='all'||r[1]===f)&&(s===''||r[0].toLowerCase().includes(s)||r[4].some(k=>k.includes(s)))).forEach(r=>g.innerHTML+=`<div class="c ${r[1].replace(' ','')}"><span class=tag>${r[1]}</span><h3>${r[0]}</h3><p><b>Банить:</b> ${r[2]}</p><p><b>Не банить:</b> ${r[3]}</p></div>`)}R();</script></body></html>
