<!doctype html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Likee Rule Assistant PRO</title><style>body{margin:0;font-family:system-ui;background:#0f172a;color:#fff}header{padding:18px;background:#111827;position:sticky;top:0}.hero{padding:14px;background:#1f2937;border-radius:16px;margin-bottom:14px}input{width:100%;padding:12px;border-radius:10px;border:0;background:#0b1220;color:#fff}.f{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{padding:10px 12px;border-radius:999px;background:#334155}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:16px}.c{background:#1f2937;padding:14px;border-radius:12px;border-left:5px solid #64748b}.Reject{border-color:#ef4444}.Conceal{border-color:#f59e0b}.Ignore{border-color:#64748b}.TagA{border-color:#3b82f6}.tag{display:inline-block;background:#111827;padding:3px 8px;border-radius:999px;font-size:12px}.quick{background:#111827;padding:14px;border-radius:16px;margin:16px}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #273244}</style></head><body><header><h1>Likee Rule Assistant PRO</h1><div class='hero'><input id=q placeholder='нож, вейп, паспорт, roblox...'><div class=f><span class=btn>Reject</span><span class=btn>Conceal</span><span class=btn>Ignore</span><span class=btn>Tag A</span></div></div></header><div class=quick><h3>⚡ Режим 3 секунды</h3><div class=row><span>Пистолет на человека</span><b>Reject</b></div><div class=row><span>Нож лежит</span><b>Ignore</b></div><div class=row><span>Ножевое нападение</span><b>Reject</b></div><div class=row><span>Вейп</span><b>Conceal</b></div><div class=row><span>QR купить вейп</span><b>Reject</b></div><div class=row><span>Паспорт</span><b>Reject</b></div><div class=row><span>Budдийская свастика</span><b>Ignore</b></div></div><div id=g class=g></div><script>const d=[['Оружие','Reject','Ствол на человека или стрельба.'],['Нож','Reject','Нападение ножом.'],['Кровь','Reject','Органы и открытые раны.'],['Животные','Reject','Избиение и расчленение.'],['Суицид','Reject','Петля и порезы.'],['Терроризм','Reject','Пропаганда.'],['Курение','Conceal','Взрослый курит.'],['Продажа никотина','Reject','QR и цена.'],['Паспорт','Reject','Личные данные.'],['Мокрая девушка','TagA','Проверить Tag A.'],['Военный стреляет в воздух','Ignore','Не по людям.'],['Roblox/Gacha','Reject','Детский хоррор.'],['Зацепер','Reject','Крыша поезда.'],['ДТП','Reject','Кровь или погибшие.'],['Ахегао','Reject','Сексуализированный контент.']];const g=document.getElementById('g'),q=document.getElementById('q');function r(){const s=q.value.toLowerCase();g.innerHTML='';d.filter(x=>x[0].toLowerCase().includes(s)||s==='').forEach(x=>g.innerHTML+=`<div class='c ${x[1]}'><div class=tag>${x[1]}</div><h3>${x[0]}</h3><p>${x[2]}</p></div>`)}q.oninput=r;r();</script></body></html>
